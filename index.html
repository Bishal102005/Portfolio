.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.nogl,.nogl body{overflow:auto;height:auto}
.nogl #c,.nogl .hud,.nogl .rib,.nogl nav,.nogl #load,.nogl .hint{display:none}
.nogl .sr{position:static;width:auto;height:auto;clip-path:none;max-width:680px;margin:80px auto;padding:0 20px;line-height:1.6}

const sh=[];for(let i=0;i<S;i++){const geo=new THREE.PlaneGeometry(W,H,N,1);geo.translate(W/2,0,0);
 const fm=new THREE.Mesh(geo,mat(tex[2*i],THREE.FrontSide)),bm=new THREE.Mesh(geo,mat(tex[2*i+1],THREE.BackSide));grp.add(fm,bm);sh.push({geo,fm,bm,p:-1,tp:0})}
function bend(s,i){const p=s.p,th=p*Math.PI,lag=Math.sin(p*Math.PI)*.55,a=s.geo.attributes.position.array,dx=W/N,k=p*p*(3-2*p),zb=(S-i)*E*(1-k)+i*E*k;let x=0,z=0;
 for(let j=0;j<=N;j++){if(j){const ph=th-lag*j/N;x+=Math.cos(ph)*dx;z+=Math.sin(ph)*dx}a[j*3]=x;a[j*3+2]=z+zb;a[(N+1+j)*3]=x;a[(N+1+j)*3+2]=z+zb}
 s.geo.attributes.position.needsUpdate=true;s.geo.computeVertexNormals();s.geo.computeBoundingSphere()}
const lm=new THREE.MeshStandardMaterial({color:0x4a261d,roughness:.7});
const bR=new THREE.Mesh(new THREE.BoxGeometry(W+.07,H+.07,.03),lm),bL=bR.clone();bR.position.set(W/2,0,-.02);bL.position.set(-W/2,0,-.02);
const sp=new THREE.Mesh(new THREE.BoxGeometry(.05,H+.07,.03),lm);sp.position.z=-.02;grp.add(bR,bL,sp);
const pg=new THREE.BufferGeometry(),pa=new Float32Array(360);for(let i=0;i<120;i++){pa[i*3]=(Math.random()-.5)*8;pa[i*3+1]=(Math.random()-.5)*6;pa[i*3+2]=(Math.random()-.5)*4}
pg.setAttribute('position',new THREE.BufferAttribute(pa,3));scene.add(new THREE.Points(pg,new THREE.PointsMaterial({size:.025,color:0xfff1cf,transparent:true,opacity:.45,depthWrite:false})));

/* state */
let cur=0,target=0,side=1,acc=0,hov=0,portrait=false,dist=5,px=0,py=0,wheelT=0,last=performance.now();
const $=id=>document.getElementById(id),ind=$('ind'),nav=$('nav');
NAV.forEach(n=>{const b=document.createElement('button');b.textContent=n[0];b.onclick=()=>go(n[1],0);nav.appendChild(b)});
function ui(){const n=target;ind.textContent=LABEL[n]+(n>0&&n<8?', pages '+(2*n-1)+' and '+2*n:'');$('prev').disabled=n==0&&(!portrait||true)&&n==0;$('next').disabled=n==8;
 [...nav.children].forEach((b,i)=>b.setAttribute('aria-current',String(NAV[i][1]<=n&&(i==NAV.length-1||NAV[i+1][1]>n))))}
function go(n,s){side=s;if(location.hash.slice(1)!==NAMES[n])location.hash=NAMES[n];else{target=n;ui()}hint()}
addEventListener('hashchange',()=>{const i=NAMES.indexOf(location.hash.slice(1));if(i>=0){target=i;if(i==0)side=1;if(i==8)side=0;ui()}});
function step(d){let n=target,s=side;
 if(portrait){if(d>0){if(n==8)return;if(s==0&&n>0)s=1;else{n++;s=0}}else{if(n==0)return;if(s==1&&n>0)s=0;else{n--;s=1}}}
 else{n=Math.max(0,Math.min(8,n+d));s=n==0?1:0}go(n,s)}
const hint=()=>{$('hint').style.opacity=0};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('rib').onclick=()=>go(7,0);
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='PageDown')step(1);if(e.key=='ArrowLeft'||e.key=='PageUp')step(-1);if(e.key=='Home')go(0,1);if(e.key=='End')go(8,0)});
addEventListener('wheel',e=>{const t=performance.now();if(Math.abs(e.deltaY)>25&&t-wheelT>800){wheelT=t;step(e.deltaY>0?1:-1)}},{passive:true});
const rc=new THREE.Raycaster();let d0=null;
cv.addEventListener('pointerdown',e=>{d0=[e.clientX,e.clientY]});
cv.addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5;hov=portrait?0:(px>.32?1:px<-.32?-1:0)});
cv.addEventListener('pointerleave',()=>{hov=0});
cv.addEventListener('pointerup',e=>{if(!d0)return;const dx=e.clientX-d0[0],dy=e.clientY-d0[1];d0=null;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)return step(dx<0?1:-1);if(Math.hypot(dx,dy)>10)return;
 if(cur==target&&sh.every(s=>Math.abs(s.p-s.tp)<.01)){rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
  const L=[];if(cur<8)L.push(sh[cur].fm);if(cur>0)L.push(sh[cur-1].bm);const h=rc.intersectObjects(L)[0];
  if(h){const f=h.object===sh[cur]?.fm?2*cur:2*cur-1,u=f%2?1-h.uv.x:h.uv.x,y=(1-h.uv.y)*TH,hit=(HIT[f]||[]).find(r=>y>r[0]&&y<r[1]&&u*TW>40);
   if(hit){const a=hit[2];return typeof a=='number'?go(a,0):a.startsWith('mailto')?location.href=a:open(a,'_blank','noopener')}
   return step(f%2==0?1:-1)}}
 step(e.clientX>innerWidth/2?1:-1)});
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();portrait=w/h<.95;ui()}
addEventListener('resize',resize);
const i0=NAMES.indexOf(location.hash.slice(1));if(i0>0){cur=target=i0;side=i0==8?0:0}resize();
sh.forEach((s,i)=>{s.p=s.tp=i<cur?1:0;bend(s,i)});
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(cur!=target){acc+=dt;if(RM||acc>.085){acc=0;cur+=RM?target-cur:Math.sign(target-cur)}}
 sh.forEach((s,i)=>{s.tp=i<cur?1:0;if(cur==target&&!RM){if(hov>0&&i==cur)s.tp=.07;if(hov<0&&i==cur-1)s.tp=.93}
  const o=s.p;s.p+=(s.tp-s.p)*(1-Math.exp(-dt*(RM?60:6.5)));if(Math.abs(s.tp-s.p)<.0005)s.p=s.tp;if(s.p!==o)bend(s,i)});
 bL.visible=cur>0;bR.visible=cur<8;
 const fx=portrait?(side?W/2:-W/2):(target==0?W/2:target==8?-W/2:0),hw=portrait?W*.62:(target==0||target==8?W*.65:W*1.12),tn=Math.tan(.5*38*Math.PI/180);
 const dd=Math.max(hw/(tn*cam.aspect),H*.68/tn);dist+=(dd-dist)*Math.min(1,dt*4);cam.position.set(0,.35,dist);cam.lookAt(0,0,0);
 grp.position.x+=(-fx-grp.position.x)*Math.min(1,dt*5);
 const t=now/1000;grp.position.y=RM?0:Math.sin(t*.8)*.025;grp.rotation.y+=((RM?0:px*.18)-grp.rotation.y)*.05;grp.rotation.x+=((RM?-.1:-.1+py*.1)-grp.rotation.x)*.05;
 const a=pg.attributes.position.array;for(let i=0;i<120;i++){a[i*3+1]+=dt*.04;if(a[i*3+1]>3)a[i*3+1]=-3}pg.attributes.position.needsUpdate=true;
 R.render(scene,cam);requestAnimationFrame(loop)}
$('load').style.opacity=0;setTimeout(()=>$('load').remove(),900);ui();requestAnimationFrame(loop);
})();
</script>
